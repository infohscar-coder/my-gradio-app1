name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is missing or unavailable to this workflow."
            exit 1
          fi
          case "$HF_TOKEN" in
            hf_*) ;;
            *)
              echo "::error::HF_TOKEN must be a Hugging Face user access token (hf_...)."
              exit 1
              ;;
          esac
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote add space "https://user:$HF_TOKEN@huggingface.co/spaces/oepajs0/my-universe-io"
          git checkout -B main "$GITHUB_SHA"
          git ls-remote space refs/heads/main
          git push --force space main
